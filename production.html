<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    --ink: #16181c; --panel: #1f232a; --line: #33383f;
    --amber: #f2a541; --ok: #3fb27f; --warn: #e0b23a; --err: #e2564f;
    --text: #f2f0eb; --text-dim: #9aa0aa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  nav {
    display: flex; gap: 4px; padding: 12px 24px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  nav a {
    color: var(--text-dim); text-decoration: none; font-size: 13px;
    padding: 8px 14px; border-radius: 8px;
  }
  nav a.active { background: var(--panel); color: var(--amber); font-weight: 700; }

  header {
    padding: 20px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; }
  header .sub { color: var(--text-dim); font-size: 13px; }

  .controls { display: flex; gap: 14px; align-items: flex-end; padding: 20px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .control { display: flex; flex-direction: column; gap: 6px; }
  .control label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
  .control select { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px; min-width: 160px; }

  .status-pill { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: var(--panel); color: var(--text-dim); display: inline-flex; align-items: center; gap: 6px; }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); }
  .status-pill.live .dot { background: var(--ok); }

  main { padding: 24px; max-width: 1200px; margin: 0 auto; }

  .machine-status {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 24px; margin-bottom: 24px;
  }
  .machine-status .big-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
  .machine-status .status-text { font-size: 22px; font-weight: 700; }
  .machine-status .status-note { color: var(--text-dim); font-size: 13px; margin-top: 2px; }

  .summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .summary-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; position: relative; }
  .summary-card .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
  .summary-card .value { font-size: 26px; font-weight: 700; }
  .summary-card .spinner { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 24px; }
  .panel h2 { font-size: 15px; margin: 0 0 4px; font-weight: 700; }
  .panel .panel-sub { color: var(--text-dim); font-size: 12px; margin-bottom: 16px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<nav>
  <a href="index.html">Punch In/Out</a>
  <a href="production.html" class="active">Production</a>
  <a href="dashboard.html">Login / Operator</a>
</nav>

<header>
  <div>
    <h1>Production Dashboard</h1>
    <div class="sub">Live machine status, output, and speed.</div>
  </div>
  <span class="status-pill" id="connPill"><span class="dot"></span><span id="connText">Connecting…</span></span>
</header>

<div class="controls">
  <div class="control">
    <label for="machineSelect">Machine</label>
    <select id="machineSelect"><option value="">Loading…</option></select>
  </div>
</div>

<main>
  <div class="machine-status" id="machineStatusCard">
    <div class="big-dot" id="statusDot" style="background:#9aa0aa"></div>
    <div>
      <div class="status-text" id="statusText">—</div>
      <div class="status-note" id="statusNote">—</div>
    </div>
  </div>

  <div class="summary-row" id="summaryRow"></div>

  <div class="two-col">
    <div class="panel">
      <h2>Last 3 Days</h2>
      <div class="panel-sub">Daily production total.</div>
      <canvas id="threeDayChart" height="180"></canvas>
    </div>
    <div class="panel">
      <h2>Speed Trend (Today)</h2>
      <div class="panel-sub">Units per minute, hourly average.</div>
      <canvas id="speedChart" height="180"></canvas>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyAY_kKOZ8oExdu7WvW6IODW9IinS31lTlo",
  authDomain: "without-rd-id.firebaseapp.com",
  databaseURL: "https://without-rd-id-default-rtdb.firebaseio.com",
  projectId: "without-rd-id",
  storageBucket: "without-rd-id.firebasestorage.app",
  messagingSenderId: "881069463815",
  appId: "1:881069463815:web:2dab212e0feebbe0748da2"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const connPill = document.getElementById('connPill');
const connText = document.getElementById('connText');
const machineSelect = document.getElementById('machineSelect');

// Thresholds for status inference (no firmware change needed - computed from
// heartbeat age and time since last production event)
const OFFLINE_AFTER_SEC = 120;   // no heartbeat in 2 min -> Offline
const IDLE_AFTER_SEC = 300;      // online but no production event in 5 min -> Idle
const SPEED_WINDOW_SEC = 600;    // trailing 10 min window for "current speed"

let currentMachine = null;
let currentEvents = {};
let lastSeen = null;
let threeDayChart = null;
let speedChart = null;
let tickTimer = null;

onAuthStateChanged(auth, (user) => {
  if (user) {
    connPill.classList.add('live');
    connText.textContent = 'Connected';
    loadMachineList();
  } else {
    signInAnonymously(auth).catch(() => { connText.textContent = 'Connection failed'; });
  }
});

function loadMachineList() {
  onValue(ref(db, 'Machines'), (snap) => {
    const data = snap.val() || {};
    const machineIds = Object.keys(data);
    machineSelect.innerHTML = '';
    if (machineIds.length === 0) {
      machineSelect.innerHTML = '<option value="">No machines found</option>';
      return;
    }
    machineIds.sort().forEach(id => {
      const opt = document.createElement('option');
      opt.value = id; opt.textContent = id;
      machineSelect.appendChild(opt);
    });
    if (!currentMachine) {
      currentMachine = machineIds[0];
      machineSelect.value = currentMachine;
      subscribeToMachine(currentMachine);
    }
  });
}

machineSelect.addEventListener('change', () => {
  currentMachine = machineSelect.value;
  if (currentMachine) subscribeToMachine(currentMachine);
});

function subscribeToMachine(machineId) {
  onValue(ref(db, `Machines/${machineId}/lastSeen`), (snap) => {
    lastSeen = snap.val();
    renderStatus();
  });
  onValue(ref(db, `Sensor/${machineId}/events`), (snap) => {
    currentEvents = snap.val() || {};
    renderAll();
  });

  // Re-check status/speed every 15s even if no new data arrives,
  // since "time since last event" changes just by the clock ticking.
  if (tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(() => { renderStatus(); renderSummary(); }, 15000);
}

function eventList() {
  return Object.values(currentEvents).filter(e => e && typeof e.timestamp === 'number');
}

function dateKeyFor(ts) {
  return new Date(ts * 1000).toISOString().slice(0, 10);
}

function sumForDate(events, dateKey) {
  return events.filter(e => dateKeyFor(e.timestamp) === dateKey).reduce((a, e) => a + e.count, 0);
}

function renderAll() {
  renderStatus();
  renderSummary();
  renderThreeDayChart();
  renderSpeedChart();
}

function renderStatus() {
  const nowSec = Math.floor(Date.now() / 1000);
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const note = document.getElementById('statusNote');

  if (lastSeen === null || (nowSec - lastSeen) > OFFLINE_AFTER_SEC) {
    dot.style.background = 'var(--text-dim)';
    text.textContent = 'Offline';
    note.textContent = lastSeen ? `No signal for ${Math.round((nowSec - lastSeen) / 60)} min` : 'No signal received yet';
    return;
  }

  const events = eventList();
  const lastEventTs = events.length ? Math.max(...events.map(e => e.timestamp)) : null;
  const secSinceLastEvent = lastEventTs ? nowSec - lastEventTs : Infinity;

  if (secSinceLastEvent <= IDLE_AFTER_SEC) {
    dot.style.background = 'var(--ok)';
    text.textContent = 'Running';
    note.textContent = `Last unit ${secSinceLastEvent}s ago`;
  } else {
    dot.style.background = 'var(--warn)';
    text.textContent = 'Idle';
    note.textContent = lastEventTs ? `No production for ${Math.round(secSinceLastEvent / 60)} min` : 'No production recorded yet';
  }
}

function renderSummary() {
  const events = eventList();
  const nowSec = Math.floor(Date.now() / 1000);
  const today = new Date().toISOString().slice(0, 10);
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  const monthPrefix = today.slice(0, 7); // YYYY-MM

  const todayTotal = sumForDate(events, today);
  const yesterdayTotal = sumForDate(events, yesterday);
  const monthTotal = events.filter(e => dateKeyFor(e.timestamp).startsWith(monthPrefix)).reduce((a, e) => a + e.count, 0);

  const speedWindowEvents = events.filter(e => nowSec - e.timestamp <= SPEED_WINDOW_SEC);
  const speedWindowTotal = speedWindowEvents.reduce((a, e) => a + e.count, 0);
  const currentSpeed = (speedWindowTotal / (SPEED_WINDOW_SEC / 60)).toFixed(2);

  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-card">
      <div class="label">Today's Production</div>
      <div class="value">${todayTotal.toFixed(1)}</div>
    </div>
    <div class="summary-card">
      <div class="label">Yesterday's Production</div>
      <div class="value">${yesterdayTotal.toFixed(1)}</div>
    </div>
    <div class="summary-card">
      <div class="label">This Month</div>
      <div class="value">${monthTotal.toFixed(1)}</div>
      <div class="spinner">${events.length > 3000 ? 'Large history - may take a moment to load' : ''}</div>
    </div>
    <div class="summary-card">
      <div class="label">Current Speed</div>
      <div class="value">${currentSpeed}<span style="font-size:13px;color:var(--text-dim)"> /min</span></div>
    </div>
  `;
}

function renderThreeDayChart() {
  const events = eventList();
  const labels = [];
  const data = [];
  for (let i = 2; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10);
    labels.push(d);
    data.push(sumForDate(events, d));
  }
  const ctx = document.getElementById('threeDayChart').getContext('2d');
  if (threeDayChart) threeDayChart.destroy();
  threeDayChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Production', data, backgroundColor: '#f2a541' }] },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: '#33383f' }, ticks: { color: '#9aa0aa' } },
        y: { beginAtZero: true, grid: { color: '#33383f' }, ticks: { color: '#9aa0aa' } }
      }
    }
  });
}

function renderSpeedChart() {
  const events = eventList();
  const today = new Date().toISOString().slice(0, 10);
  const todaysEvents = events.filter(e => dateKeyFor(e.timestamp) === today);

  const hourlyTotals = new Array(24).fill(0);
  todaysEvents.forEach(e => {
    const hour = new Date(e.timestamp * 1000).getHours();
    hourlyTotals[hour] += e.count;
  });
  const speedByHour = hourlyTotals.map(total => parseFloat((total / 60).toFixed(2))); // units/min avg for that hour

  const labels = Array.from({ length: 24 }, (_, h) => `${String(h).padStart(2, '0')}:00`);
  const ctx = document.getElementById('speedChart').getContext('2d');
  if (speedChart) speedChart.destroy();
  speedChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ label: 'Units/min', data: speedByHour, borderColor: '#f2a541', backgroundColor: 'rgba(242,165,65,0.15)', fill: true, tension: 0.3 }] },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: '#33383f' }, ticks: { color: '#9aa0aa', maxRotation: 0, autoSkip: true, maxTicksLimit: 8 } },
        y: { beginAtZero: true, grid: { color: '#33383f' }, ticks: { color: '#9aa0aa' } }
      }
    }
  });
}
</script>
</body>
</html>
