<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Machine Punch</title>
<style>
  :root {
    --ink: #16181c;
    --panel: #1f232a;
    --line: #33383f;
    --amber: #f2a541;
    --amber-dim: #8a6a2f;
    --ok: #3fb27f;
    --err: #e2564f;
    --text: #f2f0eb;
    --text-dim: #9aa0aa;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }
  .machine-tag {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .machine-tag .label {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .machine-tag .id {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .status-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--text-dim);
    display: inline-block;
    margin-right: 6px;
  }
  .status-dot.live { background: var(--ok); }

  /* --- Machine selector for testing --- */
  .machine-selector {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .machine-selector .title {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .machine-selector select {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 16px;
  }
  .machine-selector button {
    width: 100%;
    background: var(--amber);
    color: #1a1204;
    border: none;
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  /* --- Currently running card --- */
  .running-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
  }
  .running-card .eyebrow {
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--amber); margin-bottom: 8px;
  }
  .running-card .op-name { font-size: 24px; font-weight: 700; }
  .running-card .since { color: var(--text-dim); font-size: 14px; margin-top: 4px; }

  /* --- Form --- */
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 20px;
    padding: 14px 16px;
    border-radius: 10px;
    outline: none;
  }
  .field input:focus { border-color: var(--amber); }

  button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 18px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn-primary { background: var(--amber); color: #1a1204; }
  .btn-primary:active { background: var(--amber-dim); }
  .btn-danger { background: var(--err); color: #fff; }
  .btn-danger:active { opacity: 0.85; }
  .btn-secondary { background: var(--line); color: var(--text); }
  .btn-secondary:active { opacity: 0.85; }

  .msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  .msg.show { display: block; }
  .msg.ok { background: rgba(63,178,127,0.15); color: var(--ok); border: 1px solid rgba(63,178,127,0.3); }
  .msg.err { background: rgba(226,86,79,0.15); color: var(--err); border: 1px solid rgba(226,86,79,0.3); }

  .footer-note {
    margin-top: auto;
    padding-top: 24px;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
  }

  .hidden { display: none; }

  /* Scrap entry styles */
  .scrap-prompt {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-top: 16px;
  }
  .scrap-prompt .title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--amber);
  }
  .scrap-prompt .subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .btn-row {
    display: flex;
    gap: 10px;
  }
  .btn-row button {
    flex: 1;
    padding: 14px;
    font-size: 15px;
  }
  .scrap-prompt input {
    font-size: 24px;
    padding: 16px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="machine-tag">
    <div>
      <div class="label"><span class="status-dot" id="connDot"></span>Machine</div>
      <div class="id" id="machineIdDisplay">—</div>
    </div>
  </div>

  <!-- Machine selector for testing (shown when no machine in URL) -->
  <div id="machineSelector" class="machine-selector hidden">
    <div class="title">🔧 Select Machine (for testing)</div>
    <select id="manualMachineSelect">
      <option value="M01-A">M01-A</option>
      <option value="M01-B">M01-B</option>
      <option value="M01-C">M01-C</option>
    </select>
    <button id="setMachineBtn">Go to Machine</button>
  </div>

  <!-- Shown when someone is already punched in -->
  <div id="runningView" class="hidden">
    <div class="running-card">
      <div class="eyebrow">Currently running</div>
      <div class="op-name" id="runningOpName">—</div>
      <div class="since" id="runningSince">—</div>
    </div>
    <button class="btn-danger" id="punchOutBtn">Punch Out</button>
  </div>

  <!-- Shown when nobody is punched in -->
  <div id="loginView" class="hidden">
    <div class="field">
      <label for="operatorId">Operator ID</label>
      <input id="operatorId" type="text" inputmode="text" autocomplete="off" placeholder="e.g. OP1023">
    </div>
    <div class="field">
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••">
    </div>
    <button class="btn-primary" id="punchInBtn">Punch In</button>
  </div>

  <!-- Scrap entry - shown during punch out -->
  <div id="scrapView" class="hidden">
    <div class="scrap-prompt">
      <div class="title">📊 Enter Scrap Quantity</div>
      <div class="subtitle">How many units were scrapped during this session?</div>
      <div class="field">
        <label for="scrapQuantity">Scrap Units</label>
        <input id="scrapQuantity" type="number" min="0" step="1" placeholder="0">
      </div>
      <div class="btn-row">
        <button class="btn-secondary" id="scrapCancelBtn">Skip (0 scrap)</button>
        <button class="btn-primary" id="scrapConfirmBtn">Confirm & Punch Out</button>
      </div>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="footer-note">
    Scan this machine's QR code again anytime to punch out.<br>
    <a href="dashboard11.html" style="color: var(--amber); text-decoration: none;">Production Dashboard</a>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js';
import { getDatabase, ref, get, set, push, onValue } from 'https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyAY_kKOZ8oExdu7WvW6IODW9IinS31lTlo",
  authDomain: "without-rd-id.firebaseapp.com",
  databaseURL: "https://without-rd-id-default-rtdb.firebaseio.com",
  projectId: "without-rd-id",
  storageBucket: "without-rd-id.firebasestorage.app",
  messagingSenderId: "881069463815",
  appId: "1:881069463815:web:2dab212e0feebbe0748da2"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// Machine ID comes from the QR code: punch.html?machine=M01
const params = new URLSearchParams(window.location.search);
let machineId = params.get('machine');

const machineIdDisplay = document.getElementById('machineIdDisplay');
const connDot = document.getElementById('connDot');
const runningView = document.getElementById('runningView');
const loginView = document.getElementById('loginView');
const runningOpName = document.getElementById('runningOpName');
const runningSince = document.getElementById('runningSince');
const msg = document.getElementById('msg');
const scrapView = document.getElementById('scrapView');
const scrapQuantity = document.getElementById('scrapQuantity');
const scrapConfirmBtn = document.getElementById('scrapConfirmBtn');
const scrapCancelBtn = document.getElementById('scrapCancelBtn');
const machineSelector = document.getElementById('machineSelector');

let pendingPunchOut = null;

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = 'msg show ' + type;
}

// Helper: dateKeyFor - same 7am-7am shift logic as dashboard
const SHIFT_START_HOUR = 7;
const FACTORY_UTC_OFFSET_MINUTES = 330;

function dateKeyFor(ts) {
  const localTs = ts + FACTORY_UTC_OFFSET_MINUTES * 60;
  const shifted = new Date((localTs - SHIFT_START_HOUR * 3600) * 1000);
  return shifted.toISOString().slice(0, 10);
}

// Handle manual machine selection
document.getElementById('setMachineBtn').addEventListener('click', () => {
  const selected = document.getElementById('manualMachineSelect').value;
  if (selected) {
    window.location.search = '?machine=' + selected;
  }
});

if (!machineId) {
  machineIdDisplay.textContent = 'Select a machine';
  machineSelector.classList.remove('hidden');
  showMsg('Please select a machine from the dropdown above.', 'err');
} else {
  machineIdDisplay.textContent = machineId;
  machineSelector.classList.add('hidden');

  onAuthStateChanged(auth, (user) => {
    if (user) {
      connDot.classList.add('live');
      watchMachineState();
    } else {
      signInAnonymously(auth).catch((err) => {
        showMsg('Could not connect: ' + err.message, 'err');
      });
    }
  });
}

function watchMachineState() {
  const currentOpRef = ref(db, `Machines/${machineId}/currentOperator`);
  onValue(currentOpRef, (snapshot) => {
    const data = snapshot.val();
    if (data && data.operatorId) {
      runningView.classList.remove('hidden');
      loginView.classList.add('hidden');
      scrapView.classList.add('hidden');
      runningOpName.textContent = data.name || data.operatorId;
      const since = data.punchInTime ? new Date(data.punchInTime * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : '';
      runningSince.textContent = since ? `Punched in at ${since}` : '';
    } else {
      runningView.classList.add('hidden');
      loginView.classList.remove('hidden');
      scrapView.classList.add('hidden');
    }
  });
}

document.getElementById('punchInBtn').addEventListener('click', async () => {
  const operatorId = document.getElementById('operatorId').value.trim();
  const pin = document.getElementById('pin').value.trim();

  if (!operatorId || !pin) {
    showMsg('Enter your Operator ID and PIN.', 'err');
    return;
  }

  try {
    const opSnap = await get(ref(db, `Operators/${operatorId}`));
    if (!opSnap.exists()) {
      showMsg('Operator ID not found.', 'err');
      return;
    }
    const opData = opSnap.val();
    if (String(opData.pin) !== pin) {
      showMsg('Incorrect PIN.', 'err');
      return;
    }

    const punchInTime = Math.floor(Date.now() / 1000);
    const sessionRef = push(ref(db, `Sessions/${machineId}`));
    await set(sessionRef, {
      operatorId,
      name: opData.name || operatorId,
      punchIn: punchInTime,
      punchOut: null,
      status: 'open'
    });

    await set(ref(db, `Machines/${machineId}/currentOperator`), {
      operatorId,
      name: opData.name || operatorId,
      punchInTime,
      sessionId: sessionRef.key
    });

    showMsg('Punched in. Production will now be credited to you.', 'ok');
    document.getElementById('pin').value = '';
  } catch (err) {
    showMsg('Punch in failed: ' + err.message, 'err');
  }
});

// Handle punch out button - show scrap entry
document.getElementById('punchOutBtn').addEventListener('click', async () => {
  try {
    const currentOpSnap = await get(ref(db, `Machines/${machineId}/currentOperator`));
    const currentOp = currentOpSnap.val();
    if (!currentOp) {
      showMsg('No active session found.', 'err');
      return;
    }

    pendingPunchOut = currentOp;
    scrapView.classList.remove('hidden');
    scrapQuantity.value = '';
    scrapQuantity.focus();
    showMsg('', '');
    
  } catch (err) {
    showMsg('Error: ' + err.message, 'err');
  }
});

// Confirm punch out with scrap
scrapConfirmBtn.addEventListener('click', async () => {
  await completePunchOut(parseFloat(scrapQuantity.value) || 0);
});

// Cancel / skip scrap
scrapCancelBtn.addEventListener('click', async () => {
  await completePunchOut(0);
});

scrapQuantity.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const val = parseFloat(scrapQuantity.value) || 0;
    completePunchOut(val);
  }
});

async function completePunchOut(scrapAmount) {
  try {
    const currentOp = pendingPunchOut;
    if (!currentOp) {
      showMsg('No active session found.', 'err');
      return;
    }

    const punchOutTime = Math.floor(Date.now() / 1000);

    if (currentOp.sessionId) {
      await set(ref(db, `Sessions/${machineId}/${currentOp.sessionId}/punchOut`), punchOutTime);
      await set(ref(db, `Sessions/${machineId}/${currentOp.sessionId}/status`), 'closed');
    }

    const sessionSnap = await get(ref(db, `Sessions/${machineId}/${currentOp.sessionId}`));
    const sessionData = sessionSnap.val();

    if (scrapAmount > 0) {
      const dateKey = dateKeyFor(sessionData.punchIn || punchOutTime);
      const scrapRef = push(ref(db, `QualityDefects/${dateKey}/${machineId}`));
      await set(scrapRef, {
        defectType: 'Production Scrap',
        quantity: scrapAmount,
        productionOperator: sessionData.name || sessionData.operatorId,
        reportedByName: sessionData.name || sessionData.operatorId,
        reportedBy: sessionData.operatorId,
        timestamp: punchOutTime,
        sessionId: currentOp.sessionId,
        isScrap: true,
        coilNo: '',
        drumNo: ''
      });
      
      showMsg(`✅ Punched out. ${scrapAmount} scrap unit(s) recorded.`, 'ok');
    } else {
      showMsg('✅ Punched out. No scrap recorded.', 'ok');
    }

    await set(ref(db, `Machines/${machineId}/currentOperator`), null);
    scrapView.classList.add('hidden');
    pendingPunchOut = null;
    
  } catch (err) {
    showMsg('Punch out failed: ' + err.message, 'err');
  }
}

document.getElementById('pin').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('punchInBtn').click();
  }
});
</script>
</body>
</html>
